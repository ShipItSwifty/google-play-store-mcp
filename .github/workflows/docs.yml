name: Documentation

# Builds the GoogleAuthKit + GooglePlayKit DocC archive and publishes it to GitHub Pages.
# Pull requests only build it, so broken docs fail review instead of the post-merge deploy.
# Enable Pages for this repo with "Source: GitHub Actions" before the first run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deploys share one group so they never overlap; PR builds get their own and cancel superseded runs.
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build DocC
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Build DocC site
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation \
            --target GoogleAuthKit \
            --target GooglePlayKit \
            --enable-experimental-combined-documentation \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path google-play-store-mcp \
            --output-path ./docs

      # The DocC JS app does not navigate away from the archive root, so a visitor
      # landing on the Pages URL would see "page not found" without this.
      - name: Add root redirect to documentation
        run: |
          cat > ./docs/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=documentation/googleplaykit">
              <link rel="canonical" href="documentation/googleplaykit">
              <title>GooglePlayKit Documentation</title>
            </head>
            <body>
              <p>Redirecting to <a href="documentation/googleplaykit">GooglePlayKit documentation</a>…</p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
